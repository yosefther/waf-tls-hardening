name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waf_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waf_test -d waf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://waf_test:test_password@127.0.0.1:5432/waf_test
      TEST_DATABASE_URL: postgresql+psycopg://waf_test:test_password@127.0.0.1:5432/waf_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app tests migrations
      - name: Check Python style and formatting
        run: python -m ruff check app tests migrations && python -m ruff format --check app tests migrations
      - name: Run backend tests
        run: python -m pytest -q tests
      - name: Check migration matches models
        run: alembic check
